<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Hollow Pine</title>
<meta name="description" content="A 3D assassin action RPG. Grow from a boy in a hidden village into a legend: tragedy, vengeance and strength.">
<meta name="theme-color" content="#0b0908">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
  /* Hollow Pine — ink and ember. Charcoal lacquer panels, bone-white type, gold leaf and a single crimson. */
  :root { --ink: #0b0908; --panel: rgba(16,12,11,.88); --line: rgba(217,164,65,.35); --gold: #d9a441; --gold2: #f3d38a; --blood: #9b1420; --blood2: #d8323f; --bone: #efe7d6; --mut: #a39a8a; --jade: #3dd6a0; color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ink); color: var(--bone); font: 500 15px/1.45 "Zen Kaku Gothic New", system-ui, sans-serif; }
  body { overscroll-behavior: none; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  h1, h2, h3, .serif { font-family: "Shippori Mincho B1", Georgia, serif; font-weight: 800; letter-spacing: .02em; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .screen { position: fixed; inset: 0; z-index: 10; display: none; }
  .screen.on { display: block; }
  .scroll { position: absolute; inset: 0; overflow-y: auto; padding: max(16px, env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); touch-action: pan-y; }
  .col { max-width: 560px; margin: 0 auto; }

  /* buttons */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: linear-gradient(180deg, rgba(40,30,26,.92), rgba(18,13,12,.92)); color: var(--bone); padding: 12px 18px; border-radius: 4px; font-weight: 700; letter-spacing: .04em; position: relative; }
  .btn:hover { border-color: var(--gold); }
  .btn:active { transform: translateY(1px); }
  .btn.gold { background: linear-gradient(180deg, #e8bc5c, #a8771f); color: #1a0f05; border-color: #f3d38a; }
  .btn.blood { background: linear-gradient(180deg, #b01c2a, #6a0c14); border-color: #e0525e; }
  .btn.small { padding: 7px 11px; font-size: .85rem; }
  .btn:disabled { opacity: .45; cursor: default; }
  .dot { position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--blood2); color: #fff; font-size: .72rem; line-height: 18px; font-weight: 900; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .between { justify-content: space-between; }
  .mut { color: var(--mut); } .gold-t { color: var(--gold2); } .jade-t { color: var(--jade); }
  .topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .topbar h2 { margin: 0; font-size: 1.5rem; flex: 1; }
  .wallet { display: flex; gap: 10px; font-weight: 900; font-size: .9rem; }

  /* title */
  #title .brand { position: absolute; left: 0; right: 0; top: max(7vh, env(safe-area-inset-top)); text-align: center; pointer-events: none; }
  #title .kanji { font: 800 1rem "Shippori Mincho B1"; letter-spacing: .6em; color: var(--gold); opacity: .9; }
  #title h1 { margin: 6px 0 0; font-size: clamp(2.6rem, 12vw, 4.8rem); line-height: .95; color: var(--bone); text-shadow: 0 4px 30px rgba(0,0,0,.8); }
  #title .sub { margin-top: 8px; font: 800 .8rem "Zen Kaku Gothic New"; letter-spacing: .38em; text-transform: uppercase; color: var(--blood2); }
  #title .menu { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(22px + env(safe-area-inset-bottom)); width: min(92vw, 380px); display: grid; gap: 8px; }
  #title .menu .btn { width: 100%; }
  #title .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #title .who { text-align: center; font-size: .82rem; color: var(--mut); text-shadow: 0 1px 4px #000; }
  .mute { position: absolute; top: max(12px, env(safe-area-inset-top)); right: 12px; }

  /* chapters */
  .act { margin: 18px 0 8px; }
  .act h3 { margin: 0; font-size: 1.15rem; color: var(--gold2); }
  .act small { color: var(--mut); letter-spacing: .12em; text-transform: uppercase; font-weight: 700; font-size: .7rem; }
  .lv { display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: center; padding: 11px 12px; margin-bottom: 6px; background: rgba(20,15,13,.9); border: 1px solid rgba(255,255,255,.07); border-left: 3px solid var(--gold); border-radius: 4px; width: 100%; text-align: left; }
  .lv.boss { border-left-color: var(--blood2); }
  .lv.locked { opacity: .45; border-left-color: #444; }
  .lv .n { font: 800 1.2rem "Shippori Mincho B1"; color: var(--gold); text-align: center; }
  .lv b { display: block; } .lv .meta { font-size: .78rem; color: var(--mut); }
  .stars { letter-spacing: 2px; color: #4a4238; font-size: 1rem; white-space: nowrap; } .stars .on { color: var(--gold2); text-shadow: 0 0 8px rgba(243,211,138,.5); }

  /* story */
  #story { background: linear-gradient(transparent 60%, rgba(0,0,0,.75)); }
  #story::before, #story::after { content: ""; position: absolute; left: 0; right: 0; height: 9vh; background: #000; z-index: 1; }
  #story::before { top: 0; } #story::after { bottom: 0; }
  #story .box { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(9vh + 16px); width: min(94vw, 640px); z-index: 2; }
  #story .place { font-size: .72rem; letter-spacing: .3em; text-transform: uppercase; color: var(--gold); font-weight: 900; margin-bottom: 6px; }
  #story p { font: 600 clamp(1.02rem, 4.3vw, 1.3rem)/1.55 "Shippori Mincho B1", Georgia, serif; margin: 0 0 14px; min-height: 4.5em; text-shadow: 0 2px 10px #000; }
  #story p .spk { color: var(--gold2); }
  #story .row { justify-content: flex-end; }

  /* HUD */
  #hud { pointer-events: none; }
  #hud > * { pointer-events: auto; }
  .hudtop { position: absolute; top: max(10px, env(safe-area-inset-top)); left: 10px; right: 10px; display: flex; gap: 10px; align-items: flex-start; pointer-events: none; }
  .hudtop > * { pointer-events: auto; }
  .life { width: min(46vw, 250px); }
  .life .nm { font: 800 .8rem "Shippori Mincho B1"; text-shadow: 0 1px 3px #000; display: flex; justify-content: space-between; }
  .bar { height: 12px; background: rgba(0,0,0,.6); border: 1px solid rgba(255,255,255,.18); border-radius: 2px; overflow: hidden; margin-top: 3px; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, #7a0c16, #d8323f); transition: width .15s; }
  .obj { flex: 1; text-align: center; font-weight: 700; font-size: .85rem; text-shadow: 0 1px 4px #000; padding-top: 2px; }
  .obj small { display: block; color: var(--gold); font-size: .68rem; letter-spacing: .2em; text-transform: uppercase; }
  .hudr { display: flex; gap: 6px; align-items: center; }
  .icon { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: rgba(10,8,8,.7); display: grid; place-items: center; font-size: 1.05rem; }
  .bossbar { position: absolute; left: 50%; transform: translateX(-50%); top: calc(max(10px, env(safe-area-inset-top)) + 54px); width: min(88vw, 460px); text-align: center; display: none; pointer-events: none; }
  .bossbar b { font: 800 1rem "Shippori Mincho B1"; text-shadow: 0 2px 6px #000; } .bossbar small { color: var(--mut); font-size: .72rem; margin-left: 6px; }
  .bossbar .bar { height: 9px; } .bossbar .bar i { background: linear-gradient(90deg, #d9a441, #f3d38a); }
  .eye { position: absolute; left: 50%; top: calc(max(10px, env(safe-area-inset-top)) + 40px); transform: translateX(-50%); font-size: .75rem; font-weight: 900; letter-spacing: .15em; padding: 2px 10px; border-radius: 10px; background: rgba(0,0,0,.55); display: none; pointer-events: none; }
  .hint { position: absolute; left: 50%; transform: translateX(-50%); top: calc(max(10px, env(safe-area-inset-top)) + 96px); width: min(90vw, 420px); text-align: center; background: rgba(10,8,8,.82); border: 1px solid var(--line); border-radius: 4px; padding: 8px 12px; font-size: .88rem; opacity: 0; transition: opacity .3s; pointer-events: none; }
  .hint.on { opacity: 1; }
  .pad { position: absolute; right: calc(14px + env(safe-area-inset-right)); bottom: calc(18px + env(safe-area-inset-bottom)); width: 250px; height: 250px; pointer-events: none; }
  .pad button { position: absolute; pointer-events: auto; border-radius: 50%; border: 1.5px solid rgba(239,231,214,.35); background: radial-gradient(circle at 35% 30%, rgba(70,56,50,.85), rgba(14,10,9,.85)); display: grid; place-items: center; font-size: 1.3rem; touch-action: none; overflow: hidden; }
  .pad button::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(rgba(0,0,0,.72) calc(var(--cd, 0) * 360deg), transparent 0); }
  .pad button.locked { display: none; }
  .pad button kbd { position: absolute; bottom: 3px; font: 700 .55rem sans-serif; opacity: .5; }
  .pad .atk { width: 86px; height: 86px; right: 0; bottom: 0; font-size: 2rem; border-color: rgba(217,164,65,.7); }
  .pad .atk.td { background: radial-gradient(circle at 35% 30%, #7a3ab0, #2a0c40); border-color: #c89aff; box-shadow: 0 0 22px rgba(160,100,255,.8); }
  .pad .atk.td::before { content: "TAKEDOWN"; position: absolute; top: -20px; font: 900 .6rem sans-serif; letter-spacing: .15em; color: #d8b8ff; }
  .pad .dodge { width: 62px; height: 62px; right: 100px; bottom: 2px; }
  .pad .sneak { width: 52px; height: 52px; right: 108px; bottom: 76px; font-size: 1.1rem; }
  .pad .sneak.on { background: radial-gradient(circle at 35% 30%, #2f5a4a, #0c1c16); border-color: var(--jade); }
  .pad .ab { width: 50px; height: 50px; font-size: 1.15rem; }
  .joy { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 1.5px solid rgba(239,231,214,.28); background: rgba(0,0,0,.18); display: none; pointer-events: none; }
  .joy i { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px; border-radius: 50%; background: rgba(239,231,214,.35); }
  .float { position: fixed; z-index: 30; pointer-events: none; font: 900 1.05rem "Zen Kaku Gothic New"; color: #fff; text-shadow: 0 2px 0 #000, 0 0 6px #000; transform: translate(-50%, -50%); animation: fl .9s forwards; white-space: nowrap; }
  .float.crit { color: var(--gold2); font-size: 1.45rem; } .float.hurt { color: #ff5a5a; } .float.poison { color: #7aff6a; font-size: .9rem; } .float.heal { color: #6affa0; }
  .float.td { color: #d8b8ff; font: 900 1.2rem "Shippori Mincho B1"; letter-spacing: .15em; } .float.dodge { color: #9ad8ff; letter-spacing: .15em; } .float.block { color: #bbb; font-size: .85rem; } .float.info { color: var(--mut); font-size: .85rem; }
  @keyframes fl { 0% { opacity: 0; margin-top: 6px; } 15% { opacity: 1; } 100% { opacity: 0; margin-top: -46px; } }

  /* results */
  #results .col { padding-top: 6vh; text-align: center; }
  #results h2 { font-size: 2.2rem; margin: 0; }
  #results .big { font-size: 2.6rem; letter-spacing: 8px; margin: 10px 0; }
  #results .big span { color: #3a342c; display: inline-block; } #results .big span.on { color: var(--gold2); animation: pop .5s both; text-shadow: 0 0 18px rgba(243,211,138,.6); }
  @keyframes pop { from { transform: scale(2.4) rotate(-20deg); opacity: 0; } }
  .reqs { text-align: left; font-size: .85rem; margin: 0 auto 12px; max-width: 360px; }
  .reqs div { padding: 3px 0; color: var(--mut); } .reqs div.ok { color: var(--bone); }
  .gains { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
  .gains div { background: rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.08); border-radius: 4px; padding: 8px; } .gains b { display: block; font-size: 1.2rem; }
  .xpbar { height: 8px; background: rgba(0,0,0,.6); border-radius: 4px; overflow: hidden; margin: 6px 0 2px; } .xpbar i { display: block; height: 100%; background: linear-gradient(90deg, #7a5a1e, #f3d38a); transition: width .8s; }
  .news { margin: 10px 0; display: grid; gap: 6px; } .news div { background: rgba(155,20,32,.25); border: 1px solid rgba(216,50,63,.5); border-radius: 4px; padding: 8px; font-weight: 700; }

  /* lists: arts, achievements, wardrobe */
  .card { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; padding: 10px; margin-bottom: 6px; background: rgba(20,15,13,.92); border: 1px solid rgba(255,255,255,.07); border-radius: 4px; }
  .card .ic { font-size: 1.5rem; text-align: center; }
  .card b { display: block; } .card small { color: var(--mut); display: block; font-size: .78rem; }
  .pips { display: flex; gap: 3px; margin-top: 4px; } .pips i { width: 10px; height: 4px; background: #3a342c; } .pips i.on { background: var(--gold); }
  .card.done { opacity: .6; } .card.ready { border-color: var(--gold); box-shadow: 0 0 14px rgba(217,164,65,.25); }
  .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 8px; touch-action: pan-x; }
  .tabs button { flex: none; padding: 7px 12px; border-radius: 16px; border: 1px solid rgba(255,255,255,.12); background: rgba(0,0,0,.5); font-weight: 700; font-size: .82rem; }
  .tabs button.on { background: var(--gold); color: #1a0f05; border-color: var(--gold2); }
  #creator .preview { height: 44vh; }
  #creator .sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 56vh; overflow-y: auto; background: linear-gradient(transparent, rgba(8,6,6,.96) 18px); padding: 22px 14px calc(14px + env(safe-area-inset-bottom)); touch-action: pan-y; }
  #creator .head { position: absolute; top: max(12px, env(safe-area-inset-top)); left: 12px; right: 12px; display: flex; gap: 8px; align-items: center; }
  #creator .head h2 { margin: 0; flex: 1; font-size: 1.3rem; text-shadow: 0 2px 8px #000; }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip { position: relative; padding: 8px 12px; border-radius: 4px; border: 1px solid rgba(255,255,255,.14); background: rgba(24,18,16,.95); font-size: .82rem; font-weight: 700; display: flex; align-items: center; gap: 7px; }
  .chip.on { border-color: var(--gold2); box-shadow: inset 0 0 0 1px var(--gold2); }
  .chip .sw { width: 16px; height: 16px; border-radius: 50%; border: 1px solid rgba(255,255,255,.3); }
  .chip .pr { font-size: .7rem; color: var(--gold2); } .chip .pr.j { color: var(--jade); } .chip.lock { opacity: .5; }
  .stagesel { display: flex; gap: 6px; justify-content: center; margin-bottom: 10px; }
  input.name { background: rgba(0,0,0,.5); border: 1px solid var(--line); color: var(--bone); padding: 9px 11px; border-radius: 4px; font: 700 1rem "Shippori Mincho B1"; width: 100%; }

  /* engine modals + toasts */
  .gx-toasts { position: fixed; top: calc(max(10px, env(safe-area-inset-top)) + 60px); left: 50%; transform: translateX(-50%); z-index: 90; display: grid; gap: 6px; width: min(92vw, 420px); pointer-events: none; }
  .gx-toast { background: rgba(14,10,9,.95); border: 1px solid var(--gold); color: var(--bone); border-radius: 4px; padding: 8px 12px; text-align: center; animation: tin .25s; font-weight: 700; }
  .gx-toast.out { opacity: 0; transition: opacity .4s; }
  @keyframes tin { from { transform: translateY(-8px); opacity: 0; } }
  .gx-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: grid; place-items: center; z-index: 95; padding: 16px; }
  .gx-modal { width: min(100%, 400px); max-height: 86vh; overflow-y: auto; background: #120e0d; border: 1px solid var(--gold); border-radius: 6px; padding: 20px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.8); animation: tin .25s; }
  .gx-title { margin: 0 0 8px; font: 800 1.35rem "Shippori Mincho B1"; color: var(--gold2); }
  .gx-body p { margin: 6px 0; } .gx-demo { font-size: .75rem; color: var(--mut); }
  .gx-actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
  .gx-btn { font: 700 .95rem "Zen Kaku Gothic New"; padding: 10px 18px; border-radius: 4px; border: 1px solid #f3d38a; background: linear-gradient(180deg, #e8bc5c, #a8771f); color: #1a0f05; cursor: pointer; }
  .gx-btn.ghost { background: #1c1614; color: var(--bone); border-color: var(--line); }
  .gx-product { position: relative; display: flex; flex-direction: column; gap: 2px; padding: 12px; border: 1px solid var(--line); border-radius: 4px; margin-bottom: 8px; background: rgba(20,15,13,.95); text-align: left; }
  .gx-product small { color: var(--mut); margin-bottom: 6px; } .gx-product.owned { opacity: .55; } .gx-product .gx-btn { align-self: flex-start; }
  .gx-badge { position: absolute; top: -9px; right: 10px; background: var(--blood2); color: #fff; font: 900 .62rem sans-serif; padding: 2px 8px; border-radius: 9px; }
  .fade { position: fixed; inset: 0; background: #000; z-index: 80; pointer-events: none; opacity: 0; transition: opacity .5s; }
  .fade.on { opacity: 1; }
  .loading { position: fixed; inset: 0; display: grid; place-items: center; z-index: 99; background: var(--ink); font: 800 1.2rem "Shippori Mincho B1"; letter-spacing: .3em; color: var(--gold); }
  .choice { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(9vh + 20px); display: flex; gap: 12px; z-index: 3; width: max-content; }
  .choice .btn { white-space: nowrap; }
  @media (prefers-reduced-motion: reduce) { .float, #results .big span.on { animation: none; } }
</style>
</head>
<body>
<canvas id="view" aria-label="Hollow Pine game view"></canvas>
<div class="loading" id="loading">HOLLOW PINE</div>
<div class="fade" id="fade"></div>

<!-- Title -->
<section class="screen" id="title">
  <div class="brand"><div class="kanji">空 松</div><h1>Hollow Pine</h1><div class="sub">The Last Blade</div></div>
  <button class="icon mute" id="muteBtn" aria-label="Sound">🔊</button>
  <div class="menu">
    <div class="who" id="who"></div>
    <button class="btn gold" id="playBtn">Continue</button>
    <div class="grid2">
      <button class="btn" data-go="chapters">📜 Chapters</button>
      <button class="btn" data-go="creator">🎭 Character</button>
      <button class="btn" data-go="arts">🗡️ Arts &amp; Gear<span class="dot" id="spDot" hidden></span></button>
      <button class="btn" data-go="ach">🏆 Achievements<span class="dot" id="achDot" hidden></span></button>
    </div>
    <button class="btn small" data-go="shop">💎 Shop</button>
  </div>
</section>

<!-- Chapters -->
<section class="screen" id="chapters"><div class="scroll"><div class="col">
  <div class="topbar"><button class="icon" data-go="title" aria-label="Back">←</button><h2>Chapters</h2><div class="wallet" data-wallet></div></div>
  <div id="chapList"></div>
</div></div></section>

<!-- Character creator / wardrobe -->
<section class="screen" id="creator">
  <div class="head"><button class="icon" id="creatorBack" aria-label="Back">←</button><h2 id="creatorTitle">Your Assassin</h2><div class="wallet" data-wallet></div></div>
  <div class="sheet">
    <div class="stagesel" id="stageSel"></div>
    <div class="tabs" id="lookTabs"></div>
    <div id="lookBody"></div>
    <div class="row" style="margin-top:14px"><button class="btn gold" id="creatorDone" style="flex:1">Done</button></div>
  </div>
</section>

<!-- Story -->
<section class="screen" id="story">
  <div class="box"><div class="place" id="storyPlace"></div><p id="storyText"></p>
    <div class="row"><button class="btn small" id="storySkip">Skip</button><button class="btn gold" id="storyNext">Next ▸</button></div></div>
  <div class="choice" id="choiceBtns" hidden><button class="btn gold" id="chooseLight">Put the blade away</button><button class="btn blood" id="chooseShadow">Strike</button></div>
</section>

<!-- HUD -->
<section class="screen" id="hud">
  <div class="hudtop">
    <div class="life"><div class="nm"><span id="hudName"></span><span id="hudLv"></span></div><div class="bar"><i id="hpBar"></i></div></div>
    <div class="obj" id="hudObj"></div>
    <div class="hudr"><button class="icon" id="pauseBtn" aria-label="Pause">❚❚</button></div>
  </div>
  <div class="eye" id="eye"></div>
  <div class="bossbar" id="bossBar"><b id="bossName"></b><small id="bossTitle"></small><div class="bar"><i id="bossHp"></i></div></div>
  <div class="hint" id="hint"></div>
  <div class="joy" id="joy"><i></i></div>
  <div class="pad" id="pad">
    <button class="atk" id="bAtk" aria-label="Attack">⚔<kbd>J</kbd></button>
    <button class="dodge" id="bDodge" aria-label="Dodge">⤵<kbd>SPC</kbd></button>
    <button class="sneak" id="bSneak" aria-label="Sneak">👣<kbd>C</kbd></button>
  </div>
</section>

<!-- Results -->
<section class="screen" id="results"><div class="scroll"><div class="col" id="resBody"></div></div></section>

<!-- Arts & gear -->
<section class="screen" id="arts"><div class="scroll"><div class="col">
  <div class="topbar"><button class="icon" data-go="title" aria-label="Back">←</button><h2>Arts &amp; Gear</h2><div class="wallet" data-wallet></div></div>
